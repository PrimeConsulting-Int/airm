<script>
(function(){
  var bar=document.getElementById('airat-bar');
  var status=document.getElementById('airat-status');
  var errDiv=document.getElementById('airat-error');
  function setBar(pct){if(bar)bar.style.width=pct+'%';}
  function setStatus(msg){if(status)status.textContent=msg;}
  window.__airatSetBar=setBar;
  window.__airatSetStatus=setStatus;
  window.__airatHideLoading=function(){
    var el=document.getElementById('airat-loading');
    if(el){el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(function(){el.remove();},350);}
  };
  window.onerror=function(msg,src,line,col,err){
    setStatus('❌ Error al cargar');
    if(errDiv){
      errDiv.style.display='block';
      errDiv.textContent='ERROR: '+msg+'\nArchivo: '+(src||'desconocido')+'\nLínea: '+line+(err&&err.stack?'\n\nStack:\n'+err.stack:'');
    }
    return false;
  };
  window.addEventListener('unhandledrejection',function(e){
    setStatus('❌ Error de promesa');
    if(errDiv){errDiv.style.display='block';errDiv.textContent='Promise Error: '+(e.reason?e.reason.toString():'desconocido');}
  });
  setBar(10); setStatus('Cargando React…');
  /* Intercept console.error to catch Babel transpilation failures */
  var origErr=console.error;
  console.error=function(){
    var msg=Array.prototype.slice.call(arguments).join(' ');
    if(msg&&(msg.indexOf('Babel')!==-1||msg.indexOf('SyntaxError')!==-1||msg.indexOf('transform')!==-1||msg.indexOf('plugin')!==-1)){
      setStatus('❌ Error de Babel/JSX');
      if(errDiv){errDiv.style.display='block';errDiv.textContent='Babel error:\n'+msg;}
    }
    origErr.apply(console,arguments);
  };
  /* Safety timeout: if app never renders in 12s, show helpful error */
  setTimeout(function(){
    var el=document.getElementById('airat-loading');
    if(el&&el.parentNode){
      setStatus('⚠️ La aplicación tardó demasiado en cargar');
      if(errDiv){
        errDiv.style.display='block';
        errDiv.textContent='La aplicación no se cargó en 12 segundos.\n\nPosibles causas:\n1. Sin conexión a internet (CDNs no accesibles)\n2. Error interno de Babel/JSX (revise consola F12)\n3. Incompatibilidad de Recharts con React 18\n\nAbre F12 → Consola para ver el error exacto.';
      }
    }
  },12000);
})();
</script>

function getRiskLvl(s){
  if(s>=20) return {label:'CRÍTICO',color:'#dc2626',bg:'#fee2e2',code:'C',txt:'🔴'};
  if(s>=12) return {label:'ALTO',color:'#ea580c',bg:'#fed7aa',code:'A',txt:'🟠'};
  if(s>=6)  return {label:'MODERADO',color:'#ca8a04',bg:'#fef9c3',code:'M',txt:'🟡'};
  return {label:'BAJO',color:'#16a34a',bg:'#dcfce7',code:'B',txt:'🟢'};
}

function heatColor(p,i){
  const s=p*i;
  if(s>=20) return '#ef4444';
  if(s>=15) return '#f97316';
  if(s>=10) return '#fb923c';
  if(s>=6)  return '#facc15';
  if(s>=3)  return '#86efac';
  return '#4ade80';
}

function reducer(state,action){
  switch(action.type){
    case 'LOAD_DEMO': return {...state,project:DEMO.project,risks:DEMO.risks,kris:DEMO.kris,
      audit:{...state.audit,findings:DEMO.auditFindings,opinion:DEMO.auditOpinion.opinion,narrative:DEMO.auditOpinion.narrative,
        auditor:DEMO.auditOpinion.auditor,cargo:DEMO.auditOpinion.cargo,date:DEMO.auditOpinion.date},
      appetiteThreshold:DEMO.appetiteThreshold,demoLoaded:true,
      unlocked:[true,true,true,true,true,true,true]};
    case 'SET_ROLE': return {...state,role:action.v};
    case 'SET_MODULE': return {...state,activeModule:action.v};
    case 'SET_PROJECT': return {...state,project:action.v,unlocked:[true,true,...state.unlocked.slice(2)]};
    case 'UNLOCK': {const u=[...state.unlocked];u[action.idx]=true;return {...state,unlocked:u};}
    case 'SET_RISK': {const r=[...state.risks];r[action.idx]={...r[action.idx],...action.v};return {...state,risks:r};}
    case 'ADD_CUSTOM_RISK': return {...state,risks:[...state.risks,action.v]};
    case 'SET_KRI': {const k=[...state.kris];k[action.idx]={...k[action.idx],...action.v};return {...state,kris:k};}
    case 'SET_AUDIT': return {...state,audit:{...state.audit,...action.v}};
    case 'SET_CTRL_EVAL': return {...state,audit:{...state.audit,controlEvals:{...state.audit.controlEvals,[action.key]:action.v}}};
    case 'ADD_FINDING': return {...state,audit:{...state.audit,findings:[...state.audit.findings,action.v]}};
    case 'UPD_FINDING': {const f=[...state.audit.findings];f[action.idx]={...f[action.idx],...action.v};return {...state,audit:{...state.audit,findings:f}};}
    case 'SET_APPETITE': return {...state,appetiteThreshold:action.v};
    case 'TOAST': return {...state,toasts:[...state.toasts,{id:Date.now(),...action.v}]};
    case 'REMOVE_TOAST': return {...state,toasts:state.toasts.filter(t=>t.id!==action.id)};
    case 'LOAD_STATE': return {...action.v,toasts:[],changeLog:[]};
    case 'RESET': return {...initState};
    default: return state;
  }
}

/* ═══════ UTILITIES ═══════ */
function computeResidual(p,iF,iR,iL,ctrl){
  const imp=Math.max(iF||0,iR||0,iL||0);
  const inh=(p||0)*imp;
  const factor=CTRL_LVL[ctrl||0]?.factor||0;
  return Math.round(inh*(1-factor)*10)/10;
}

function computeInherent(p,iF,iR,iL){
  return (p||0)*Math.max(iF||0,iR||0,iL||0);
}

function maturi(st){
  const applied=st.risks.filter(r=>r.applies);
  if(!applied.length) return {score:0,label:'Sin datos'};
  const ctrlSat=st.audit.findings.length?Math.max(0,(1-st.audit.findings.filter(f=>f.status!=='Cerrado').length/Math.max(1,st.audit.findings.length))):0.5;
  const kriGreen=st.kris.filter(k=>k.active).length?st.kris.filter(k=>k.active&&k.currentVal!==''&&(k.id==='KRI-10'||k.id==='KRI-03'||k.id==='KRI-09'||k.id==='KRI-12'?parseFloat(k.currentVal)>=(parseFloat(k.thY)||0):parseFloat(k.currentVal)<=(parseFloat(k.thY)||99))).length/Math.max(1,st.kris.filter(k=>k.active).length):0.5;
  const actDone=applied.reduce((a,r)=>a+r.actions.filter(ac=>ac.status==='Implementado'||ac.status==='Verificado').length,0);
  const actTotal=applied.reduce((a,r)=>a+r.actions.length,0);
  const actRatio=actTotal?actDone/actTotal:0.3;
  const score=Math.round((ctrlSat*35+kriGreen*30+actRatio*35));
  const labels=['Inicial','En Desarrollo','Definido','Gestionado','Optimizado'];
  const idx=Math.min(4,Math.floor(score/20));
  return {score,label:labels[idx]};
}

function Module1(){

    ...dom,
    risks:state.risks.filter(r=>r.d===dom.id&&(filter==='Todos'||filter===dom.name)&&

  })).filter(g=>g.risks.length>0);
  const applied=state.risks.filter(r=>r.applies).length;
  function toggleApply(idx,val){dispatch({type:'SET_RISK',idx,v:{applies:val}});}
  function proceed(){

    dispatch({type:'ADD_CUSTOM_RISK',v:{...newRisk,applies:true,contextDesc:'Riesgo personalizado',p:0,iF:0,iR:0,iL:0,ctrl:2,strategy:'Mitigar',actions:[],residualObj:'',acceptJust:'',approvalLvl:'Gerencia de Riesgos',approvalName:'',approvalDate:''}});
    setShowAddModal(false);setNewRisk({d:1,code:'',name:'',desc:''});

        <div style={{fontSize:16,fontWeight:700,color:'#1e3a5f',marginBottom:16}}>➕ Agregar Riesgo Personalizado</div>

          <div key={f} style={{marginBottom:12}}>

            </select>:multi?<textarea className="fi" rows={2} value={newRisk[f]} onChange={e=>setNewRisk(n=>({...n,[f]:e.target.value}))}/>
            :<input className="fi" value={newRisk[f]} onChange={e=>setNewRisk(n=>({...n,[f]:e.target.value}))}/>}

        <div style={{display:'flex',gap:10,justifyContent:'flex-end',marginTop:16}}>
          <button className="btn-s" onClick={()=>setShowAddModal(false)}>Cancelar</button>
          <button className="btn-p" onClick={addCustom}>Agregar Riesgo</button>
        </div>

    <div style={{background:'linear-gradient(135deg,#1e3a5f,#2a5298)',color:'white',borderRadius:12,padding:'20px 24px',marginBottom:20}}>

/* ═══════ HEAT MAP COMPONENT ═══════ */
function HeatMap5x5({risks,mode,appetiteThreshold}){
  const [hovered,setHovered]=useState(null);
  const SIZE=48,GAP=3,PAD=40;
  const W=SIZE*5+GAP*4+PAD*2,H=SIZE*5+GAP*4+PAD*2;
  const lblP=['<5%','5-15%','15-35%','35-60%','>60%'];
  const lblI=['Muy bajo','Bajo','Medio','Alto','Muy alto'];
  return <div style={{overflowX:'auto'}}>
    <svg width={W} height={H+30} style={{fontFamily:'Segoe UI,sans-serif'}}>
      {/* axis labels */}
      <text x={PAD+SIZE*2.5+GAP*2} y={H+PAD+14} textAnchor="middle" fontSize={12} fill="#374151" fontWeight={600}>Probabilidad →</text>
      <text x={12} y={PAD+SIZE*2.5+GAP*2} textAnchor="middle" fontSize={12} fill="#374151" fontWeight={600} transform={`rotate(-90,12,${PAD+SIZE*2.5+GAP*2})`}>Impacto →</text>
      {/* P labels */}
      {[1,2,3,4,5].map(p=><text key={p} x={PAD+(p-1)*(SIZE+GAP)+SIZE/2} y={PAD-8} textAnchor="middle" fontSize={10} fill="#6b7280">{p}</text>)}
      {/* I labels */}
      {[5,4,3,2,1].map((imp,row)=><text key={imp} x={PAD-8} y={PAD+row*(SIZE+GAP)+SIZE/2+4} textAnchor="end" fontSize={10} fill="#6b7280">{imp}</text>)}
      {/* cells */}
      {[5,4,3,2,1].map((imp,row)=>[1,2,3,4,5].map(prob=>{
        const x=PAD+(prob-1)*(SIZE+GAP),y=PAD+row*(SIZE+GAP);
        return <rect key={`${prob}-${imp}`} x={x} y={y} width={SIZE} height={SIZE} rx={4}
          fill={heatColor(prob,imp)} opacity={.75} className="hcell"
          onMouseEnter={()=>setHovered({p:prob,i:imp})} onMouseLeave={()=>setHovered(null)}/>;
      }))}
      {/* risk dots */}
      {risks.filter(r=>{
        const p=r.p,imp=mode==='inherent'?Math.max(r.iF||0,r.iR||0,r.iL||0):undefined;
        const impR=mode==='residual'?Math.max(r.iF||0,r.iR||0,r.iL||0):undefined;
        return p&&(imp||impR);
      }).map(r=>{
        const p=r.p;
        const rawImp=Math.max(r.iF||0,r.iR||0,r.iL||0);
        const inherent=p*rawImp;
        const ctrl=CTRL_LVL[r.ctrl||0]?.factor||0;
        const residual=Math.round(inherent*(1-ctrl));
        const usedP=p;
        const usedI=mode==='residual'?Math.max(1,Math.round(rawImp*(1-ctrl))):rawImp;
        if(!usedP||!usedI)return null;
        const cx=PAD+(usedP-1)*(SIZE+GAP)+SIZE/2;
        const cy=PAD+(5-Math.min(5,Math.max(1,usedI)))*(SIZE+GAP)+SIZE/2;
        return <g key={r.code}>
          <circle cx={cx} cy={cy} r={10} fill="white" stroke="#1e3a5f" strokeWidth={2} opacity={.9}
            onMouseEnter={()=>setHovered({code:r.code,name:r.name,p:usedP,i:usedI,s:usedP*usedI})}
            onMouseLeave={()=>setHovered(null)}/>
          <text x={cx} y={cy+4} textAnchor="middle" fontSize={8} fontWeight={700} fill="#1e3a5f">{r.code}</text>
        </g>;
      })}
      {/* tooltip */}
      {hovered&&hovered.code&&<g>
        <rect x={PAD} y={H-20} width={W-PAD*2} height={24} rx={4} fill="#1e3a5f" opacity={.9}/>
        <text x={PAD+8} y={H-3} fontSize={11} fill="white">{hovered.code}: {hovered.name?.substring(0,60)} | P:{hovered.p} × I:{hovered.i} = {hovered.s}</text>
      </g>}
      {hovered&&!hovered.code&&<g>
        <rect x={PAD} y={H-20} width={200} height={22} rx={4} fill="#374151" opacity={.9}/>
        <text x={PAD+8} y={H-4} fontSize={11} fill="white">P={hovered.p} × I={hovered.i} → Puntuación={hovered.p*hovered.i}</text>
      </g>}
    </svg>
  </div>;
}

/* ═══════ MÓDULO 2 — EVALUACIÓN ═══════ */
function Module2(){
  const {state,dispatch}=useContext(AppCtx);
  const [heatMode,setHeatMode]=useState('inherent');
  const applied=state.risks.filter(r=>r.applies);
  function proceed(){
    dispatch({type:'UNLOCK',idx:3});dispatch({type:'SET_MODULE',v:3});
    dispatch({type:'TOAST',title:'Evaluación completada',msg:'Módulo 3 desbloqueado. Defina estrategias de tratamiento.'});
  }
  const domainAvg=DOMAINS.map(dom=>{
    const dr=applied.filter(r=>r.d===dom.id);
    if(!dr.length)return {name:dom.short,value:0};
    const avg=dr.reduce((a,r)=>a+computeInherent(r.p,r.iF,r.iR,r.iL),0)/dr.length;
    return {name:dom.short,value:Math.round(avg*10)/10,fullMark:25};
  });
  const stats={
    total:applied.length,
    critical:applied.filter(r=>computeInherent(r.p,r.iF,r.iR,r.iL)>=20).length,
    high:applied.filter(r=>{const s=computeInherent(r.p,r.iF,r.iR,r.iL);return s>=12&&s<20;}).length,
    moderate:applied.filter(r=>{const s=computeInherent(r.p,r.iF,r.iR,r.iL);return s>=6&&s<12;}).length,
    low:applied.filter(r=>computeInherent(r.p,r.iF,r.iR,r.iL)<6).length,
    outOfAppetite:applied.filter(r=>computeResidual(r.p,r.iF,r.iR,r.iL,r.ctrl)>state.appetiteThreshold).length,
    avgResidual:applied.length?Math.round(applied.reduce((a,r)=>a+computeResidual(r.p,r.iF,r.iR,r.iL,r.ctrl),0)/applied.length*10)/10:0,
  };

    const c=colors?.[val]||['#e5e7eb','#374151'];

  const pColors={1:['#dcfce7','#166534'],2:['#bbf7d0','#166534'],3:['#fef9c3','#854d0e'],4:['#fed7aa','#9a3412'],5:['#fee2e2','#991b1b']};
  const iColors={1:['#dcfce7','#166534'],2:['#d1fae5','#065f46'],3:['#fef9c3','#854d0e'],4:['#fed7aa','#9a3412'],5:['#fee2e2','#991b1b']};
  return <div>
    <div style={{background:'linear-gradient(135deg,#1e3a5f,#2a5298)',color:'white',borderRadius:12,padding:'20px 24px',marginBottom:20}}>

      <div style={{fontSize:12,opacity:.8,marginTop:4}}>Califique probabilidad e impacto para los {applied.length} riesgos identificados. El umbral de apetito actual es {state.appetiteThreshold}.</div>
    </div>
    {/* Stats */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:10,marginBottom:18}}>
      {[
        {l:'Total',v:stats.total,bg:'#f0f4f8',c:'#1e3a5f'},
        {l:'🔴 Crítico',v:stats.critical,bg:'#fee2e2',c:'#991b1b'},
        {l:'🟠 Alto',v:stats.high,bg:'#fed7aa',c:'#9a3412'},
        {l:'🟡 Moderado',v:stats.moderate,bg:'#fef9c3',c:'#854d0e'},
        {l:'🟢 Bajo',v:stats.low,bg:'#dcfce7',c:'#166534'},
        {l:'🚨 Fuera apetito',v:stats.outOfAppetite,bg:'#fce7f3',c:'#9d174d'},
        {l:'Resid. promedio',v:stats.avgResidual,bg:'#ede9fe',c:'#5b21b6'},
      ].map(s=><div key={s.l} style={{background:s.bg,borderRadius:8,padding:'10px 12px',textAlign:'center'}}>
        <div style={{fontSize:20,fontWeight:800,color:s.c}}>{s.v}</div>
        <div style={{fontSize:10,color:s.c,opacity:.8,marginTop:2}}>{s.l}</div>
      </div>)}
    </div>
    {/* Appetite threshold */}
    <div className="card" style={{marginBottom:16,display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
      <span style={{fontSize:13,fontWeight:600,color:'#374151'}}>🎯 Umbral de Apetito de Riesgo:</span>
      <div style={{display:'flex',gap:6}}>
        {[2,4,6,8,10,12].map(v=><button key={v} onClick={()=>dispatch({type:'SET_APPETITE',v})}
          style={{padding:'5px 12px',borderRadius:6,border:'2px solid '+(state.appetiteThreshold===v?'#1e3a5f':'#e5e7eb'),background:state.appetiteThreshold===v?'#1e3a5f':'white',color:state.appetiteThreshold===v?'white':'#374151',fontWeight:700,fontSize:12,cursor:'pointer'}}>{v}</button>)}
      </div>
      <span style={{fontSize:12,color:'#6b7280'}}>Riesgo residual {'>'} {state.appetiteThreshold} = Fuera de apetito (requiere acción)</span>
    </div>
    {/* Evaluation table */}
    <div className="card" style={{marginBottom:18}}>
      <div className="stitle">📋 Matriz de Evaluación Individual</div>
      <div style={{overflowX:'auto'}}>
        <table>
          <thead><tr>
            <th>Riesgo</th>
            <th>P<br/><span style={{fontWeight:400,fontSize:10}}>1–5</span></th>
            <th>I Financiero<br/><span style={{fontWeight:400,fontSize:10}}>1–5</span></th>
            <th>I Reputacional<br/><span style={{fontWeight:400,fontSize:10}}>1–5</span></th>
            <th>I Regulatorio<br/><span style={{fontWeight:400,fontSize:10}}>1–5</span></th>
            <th>Inherente<br/><span style={{fontWeight:400,fontSize:10}}>P×MAX(I)</span></th>
            <th>Control existente</th>
            <th>Residual</th>
            <th style={{width:80}}>vs. Apetito</th>
          </tr></thead>
          <tbody>
            {applied.map(r=>{
              const idx=state.risks.findIndex(x=>x.code===r.code&&x.d===r.d);
              const inh=computeInherent(r.p,r.iF,r.iR,r.iL);
              const res=computeResidual(r.p,r.iF,r.iR,r.iL,r.ctrl);
              const lvlI=getRiskLvl(inh);
              const lvlR=getRiskLvl(res);
              const outApp=res>state.appetiteThreshold;
              const dom=DOMAINS.find(d=>d.id===r.d);
              return <tr key={r.code}>
                <td><div style={{fontWeight:700,color:dom?.color,fontSize:12}}>{r.code}</div>
                  <div style={{fontSize:11,color:'#374151',lineHeight:1.3}}>{r.name.substring(0,55)}...</div></td>
                {['p','iF','iR','iL'].map(f=><td key={f} style={{textAlign:'center'}}>
                  <div style={{display:'flex',gap:2,justifyContent:'center',flexWrap:'wrap'}}>
                    {[1,2,3,4,5].map(v=><ScaleBtn key={v} val={v} current={r[f]||0} onSet={val=>dispatch({type:'SET_RISK',idx,v:{[f]:val}})} colors={f==='p'?pColors:iColors}/>)}
                  </div>
                </td>)}
                <td style={{textAlign:'center'}}>
                  <span style={{padding:'3px 10px',borderRadius:6,fontWeight:700,fontSize:14,background:lvlI.bg,color:lvlI.color}}>{inh||'–'}</span>
                  <div style={{fontSize:10,marginTop:2,color:lvlI.color}}>{inh?lvlI.txt+' '+lvlI.label:''}</div>
                </td>
                <td>
                  <select className="fi" style={{fontSize:11,padding:'4px 6px'}} value={r.ctrl||0}
                    onChange={e=>dispatch({type:'SET_RISK',idx,v:{ctrl:+e.target.value}})}>

                  </select>
                </td>
                <td style={{textAlign:'center'}}>
                  <span style={{padding:'3px 10px',borderRadius:6,fontWeight:700,fontSize:14,background:lvlR.bg,color:lvlR.color}}>{inh?res:'–'}</span>
                  <div style={{fontSize:10,marginTop:2,color:lvlR.color}}>{inh?lvlR.txt+' '+lvlR.label:''}</div>
                </td>
                <td style={{textAlign:'center'}}>
                  {inh?<span style={{background:outApp?'#fee2e2':'#dcfce7',color:outApp?'#991b1b':'#166534',padding:'4px 8px',borderRadius:6,fontSize:12,fontWeight:700}}>
                    {outApp?'⚠ EXCEDE':'✓ OK'}
                  </span>:'—'}
                </td>

            })}
          </tbody>
        </table>
      </div>
    </div>
    {/* Heat Map + Radar */}
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18,marginBottom:18}}>

        <div style={{display:'flex',gap:8,marginBottom:12}}>
          {['inherent','residual'].map(m=><button key={m} onClick={()=>setHeatMode(m)}
            style={{padding:'5px 14px',borderRadius:20,border:'2px solid '+(heatMode===m?'#1e3a5f':'#e5e7eb'),background:heatMode===m?'#1e3a5f':'white',color:heatMode===m?'white':'#374151',fontSize:12,fontWeight:600,cursor:'pointer'}}>
            {m==='inherent'?'Riesgo Inherente':'Riesgo Residual'}
          </button>)}

        <HeatMap5x5 risks={applied} mode={heatMode} appetiteThreshold={state.appetiteThreshold}/>

          {[{c:'#4ade80',l:'Bajo (1-5)'},{c:'#facc15',l:'Moderado (6-11)'},{c:'#f97316',l:'Alto (12-19)'},{c:'#ef4444',l:'Crítico (20-25)'}].map(x=>(

          <RadarChart data={domainAvg}>
            <PolarGrid stroke="#e5e7eb"/>

            <RT formatter={(v)=>[v.toFixed(1),'Nivel promedio']}/>

/* ═══════ MÓDULO 3 — TRATAMIENTO ═══════ */
function Module3(){
  const {state,dispatch}=useContext(AppCtx);
  const applied=state.risks.filter(r=>r.applies&&computeInherent(r.p,r.iF,r.iR,r.iL)>0);
  const needsTreat=applied.filter(r=>computeResidual(r.p,r.iF,r.iR,r.iL,r.ctrl)>state.appetiteThreshold);
  function proceed(){
    dispatch({type:'UNLOCK',idx:4});dispatch({type:'SET_MODULE',v:4});
    dispatch({type:'TOAST',title:'Tratamiento registrado',msg:'Módulo 4 desbloqueado. Configure los KRIs de monitoreo.'});
  }
  function addAction(rIdx){
    const risk=state.risks[rIdx];
    dispatch({type:'SET_RISK',idx:rIdx,v:{actions:[...risk.actions,{desc:'',resp:'',due:'',status:'Pendiente'}]}});
  }
  function updateAction(rIdx,aIdx,field,val){
    const risk=state.risks[rIdx];
    const acts=[...risk.actions];acts[aIdx]={...acts[aIdx],[field]:val};
    dispatch({type:'SET_RISK',idx:rIdx,v:{actions:acts}});
  }
  function removeAction(rIdx,aIdx){
    const risk=state.risks[rIdx];
    dispatch({type:'SET_RISK',idx:rIdx,v:{actions:risk.actions.filter((_,i)=>i!==aIdx)}});
  }
  const strategies=[
    {v:'Mitigar',icon:'🛡️',desc:'Implementar controles adicionales'},
    {v:'Transferir',icon:'🔄',desc:'Seguro, contrato con proveedor'},
    {v:'Evitar',icon:'🚫',desc:'Descontinuar la funcionalidad'},
    {v:'Aceptar',icon:'✅',desc:'Aprobación formal requerida'},
  ];
  return <div>
    <div style={{background:'linear-gradient(135deg,#1e3a5f,#2a5298)',color:'white',borderRadius:12,padding:'20px 24px',marginBottom:20}}>
      <div style={{fontSize:18,fontWeight:800}}>🛡️ Módulo 3 — Tratamiento y Plan de Acción</div>
      <div style={{fontSize:12,opacity:.8,marginTop:4}}>
        {needsTreat.length} riesgos superan el umbral de apetito ({state.appetiteThreshold}) y requieren tratamiento. Defina estrategia y plan de acción con responsables y fechas.
      </div>
    </div>
    {/* Summary */}
    <div style={{display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10,marginBottom:18}}>
      {['Mitigar','Transferir','Evitar','Aceptar'].map(s=>{
        const cnt=applied.filter(r=>r.strategy===s).length;
        const icons={'Mitigar':'🛡️','Transferir':'🔄','Evitar':'🚫','Aceptar':'✅'};
        const bgs={'Mitigar':'#dbeafe','Transferir':'#d1fae5','Evitar':'#fee2e2','Aceptar':'#fef9c3'};
        const cs={'Mitigar':'#1e40af','Transferir':'#065f46','Evitar':'#991b1b','Aceptar':'#854d0e'};
        return <div key={s} style={{background:bgs[s],borderRadius:8,padding:'12px 16px',textAlign:'center'}}>
          <div style={{fontSize:22}}>{icons[s]}</div>
          <div style={{fontSize:18,fontWeight:800,color:cs[s]}}>{cnt}</div>
          <div style={{fontSize:11,color:cs[s],fontWeight:600}}>{s}</div>
        </div>;
      })}
    </div>
    {applied.map(r=>{
      const idx=state.risks.findIndex(x=>x.code===r.code&&x.d===r.d);
      const inh=computeInherent(r.p,r.iF,r.iR,r.iL);
      const res=computeResidual(r.p,r.iF,r.iR,r.iL,r.ctrl);
      const outApp=res>state.appetiteThreshold;
      const lvlI=getRiskLvl(inh);
      const dom=DOMAINS.find(d=>d.id===r.d);
      return <div key={r.code} className="card" style={{marginBottom:14,borderLeft:`4px solid ${outApp?'#dc2626':'#22c55e'}`}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:12,flexWrap:'wrap',marginBottom:14}}>
          <div style={{flex:1}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
              <span style={{fontWeight:800,color:dom?.color,fontSize:13}}>{r.code}</span>
              <span style={{fontWeight:600,fontSize:13}}>{r.name}</span>
              {outApp&&<span style={{background:'#fee2e2',color:'#991b1b',padding:'2px 8px',borderRadius:9999,fontSize:10,fontWeight:700}}>⚠ FUERA DE APETITO</span>}
            </div>
            <div style={{display:'flex',gap:10,fontSize:12}}>
              <span>Inherente: <strong style={{color:lvlI.color}}>{inh} ({lvlI.label})</strong></span>
              <span>Residual: <strong style={{color:getRiskLvl(res).color}}>{res}</strong></span>
              <span>Diferencia: <strong>{inh-res}</strong> reducción</span>
            </div>
          </div>
          <div style={{display:'flex',gap:6}}>
            {strategies.map(s=><button key={s.v} onClick={()=>dispatch({type:'SET_RISK',idx,v:{strategy:s.v}})}
              title={s.desc}
              style={{padding:'5px 10px',borderRadius:6,border:'2px solid '+(r.strategy===s.v?'#1e3a5f':'#e5e7eb'),background:r.strategy===s.v?'#1e3a5f':'white',color:r.strategy===s.v?'white':'#374151',fontSize:12,fontWeight:600,cursor:'pointer'}}>
              {s.icon} {s.v}
            </button>)}
          </div>
        </div>
        {(r.strategy==='Mitigar'||r.strategy==='Transferir')&&<div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>

          {r.actions.length===0&&<div style={{color:'#9ca3af',fontSize:12,fontStyle:'italic',padding:'8px 0'}}>Sin acciones registradas. Haga clic en "+ Agregar acción".</div>}
          {r.actions.length>0&&<table style={{marginBottom:8}}>

                <td style={{textAlign:'center',color:'#6b7280'}}>{ai+1}</td>
                <td><input className="fi" style={{fontSize:11}} value={a.desc} onChange={e=>updateAction(idx,ai,'desc',e.target.value)} placeholder="Descripción de la acción..."/></td>
                <td><input className="fi" style={{fontSize:11}} value={a.resp} onChange={e=>updateAction(idx,ai,'resp',e.target.value)} placeholder="Área / Persona"/></td>
                <td><input className="fi" type="date" style={{fontSize:11}} value={a.due} onChange={e=>updateAction(idx,ai,'due',e.target.value)}/></td>
                <td>
                  <select className="fi" style={{fontSize:11}} value={a.status} onChange={e=>updateAction(idx,ai,'status',e.target.value)}>
                    {['Pendiente','En Progreso','Implementado','Verificado'].map(s=><option key={s}>{s}</option>)}
                  </select>
                </td>
                <td><button onClick={()=>removeAction(idx,ai)} style={{background:'none',border:'none',color:'#dc2626',cursor:'pointer',fontSize:16}}>×</button></td>
              </tr>
            ))}</tbody>
          </table>}
          <div style={{display:'flex',gap:16,alignItems:'center',marginTop:8}}>
            <div style={{fontSize:12,fontWeight:600}}>Riesgo Residual Objetivo Post-Tratamiento:</div>
            <input className="fi" type="number" style={{width:80,fontSize:12}} min={1} max={25} value={r.residualObj}
              onChange={e=>dispatch({type:'SET_RISK',idx,v:{residualObj:+e.target.value}})}
              placeholder="1-25"/>
            {r.residualObj&&r.residualObj>state.appetiteThreshold&&<span style={{color:'#dc2626',fontSize:11}}>⚠ Aún fuera del apetito</span>}
            {r.residualObj&&r.residualObj<=state.appetiteThreshold&&<span style={{color:'#16a34a',fontSize:11}}>✓ Dentro del apetito</span>}
          </div>
        </div>}
        {r.strategy==='Aceptar'&&<div style={{background:'#fef9c3',borderRadius:8,padding:'12px 16px'}}>
          <div style={{fontSize:12,fontWeight:700,marginBottom:8}}>✅ Aceptación Formal del Riesgo</div>
          <textarea className="fi" rows={2} placeholder="Justificación para la aceptación del riesgo..."
            value={r.acceptJust||''} onChange={e=>dispatch({type:'SET_RISK',idx,v:{acceptJust:e.target.value}})} style={{marginBottom:8}}/>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8}}>
            <div>
              <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Nivel de aprobación</label>
              <select className="fi" style={{fontSize:11}} value={r.approvalLvl||'Gerencia de Riesgos'}
                onChange={e=>dispatch({type:'SET_RISK',idx,v:{approvalLvl:e.target.value}})}>
                {['Jefe de Área','Gerente','Gerencia de Riesgos','Directorio'].map(l=><option key={l}>{l}</option>)}
              </select>
            </div>
            <div>
              <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Nombre aprobador</label>
              <input className="fi" style={{fontSize:11}} value={r.approvalName||''} placeholder="Nombre completo"

            <div>
              <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Fecha de aprobación</label>

/* ═══════ MÓDULO 4 — KRIs ═══════ */
function Module4(){
  const {state,dispatch}=useContext(AppCtx);
  const [showAll,setShowAll]=useState(false);
  function proceed(){
    dispatch({type:'UNLOCK',idx:5});dispatch({type:'SET_MODULE',v:5});
    dispatch({type:'TOAST',title:'KRIs configurados',msg:'Módulo 5 desbloqueado. Acceso de Auditoría disponible.'});
  }
  function getKriStatus(k){
    if(!k.active||k.currentVal===''||k.thR===''||k.thG==='')return 'grey';
    const v=parseFloat(k.currentVal);
    const r=parseFloat(k.thR),y=parseFloat(k.thY),g=parseFloat(k.thG);
    const inverted=k.id==='KRI-10'||k.id==='KRI-03'||k.id==='KRI-09'||k.id==='KRI-07'||k.id==='KRI-12'||k.id==='KRI-14';
    if(inverted){if(v>=g)return 'green';if(v>=y)return 'yellow';return 'red';}
    if(v<=g)return 'green';if(v<=y)return 'yellow';return 'red';
  }
  const activeKris=state.kris.filter(k=>k.active);
  const redCount=activeKris.filter(k=>getKriStatus(k)==='red').length;
  function Sparkline({hist}){
    if(!hist||hist.filter(v=>v!=='').length<2)return <span style={{color:'#9ca3af',fontSize:11}}>Sin datos</span>;
    const vals=hist.map(Number);const mn=Math.min(...vals),mx=Math.max(...vals);
    const range=mx-mn||1;
    const pts=vals.map((v,i)=>`${i*20},${30-((v-mn)/range)*25}`).join(' ');
    return <svg width={110} height={32} style={{display:'block'}}>
      <polyline points={pts} fill="none" stroke="#1e3a5f" strokeWidth={1.5}/>
      {vals.map((v,i)=><circle key={i} cx={i*20} cy={30-((v-mn)/range)*25} r={2.5} fill="#1e3a5f"/>)}
    </svg>;
  }
  return <div>
    <div style={{background:'linear-gradient(135deg,#1e3a5f,#2a5298)',color:'white',borderRadius:12,padding:'20px 24px',marginBottom:20}}>
      <div style={{fontSize:18,fontWeight:800}}>📈 Módulo 4 — Monitoreo y KRIs</div>
      <div style={{fontSize:12,opacity:.8,marginTop:4}}>Configure los Indicadores Clave de Riesgo (KRIs) para el monitoreo continuo de la iniciativa IA. {redCount>0&&`⚠️ ${redCount} KRI(s) en zona roja.`}</div>
    </div>
    {/* KRI dashboard */}
    {activeKris.length>0&&<div className="card" style={{marginBottom:16}}>
      <div className="stitle">📊 Dashboard de KRIs Activos</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fill,minmax(200px,1fr))',gap:10,marginBottom:4}}>
        {activeKris.map(k=>{
          const st=getKriStatus(k);
          const colors={green:'#22c55e',yellow:'#f59e0b',red:'#ef4444',grey:'#9ca3af'};
          const bgs={green:'#f0fdf4',yellow:'#fefce8',red:'#fef2f2',grey:'#f9fafb'};
          return <div key={k.id} style={{background:bgs[st],borderRadius:8,padding:'10px 12px',border:`1.5px solid ${colors[st]}30`}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:4}}>
              <span style={{fontSize:10,fontWeight:700,color:colors[st]}}>{k.id}</span>
              <div style={{width:12,height:12,borderRadius:'50%',background:colors[st]}}/>
            </div>
            <div style={{fontSize:11,fontWeight:600,color:'#1e3a5f',marginBottom:6,lineHeight:1.3}}>{k.name}</div>
            <div style={{fontSize:18,fontWeight:800,color:colors[st]}}>{k.currentVal!==''?k.currentVal+'  '+k.unit:'—'}</div>
            <div style={{fontSize:10,color:'#6b7280',marginTop:4}}>🟢≤{k.thG} 🟡≤{k.thY} 🔴&gt;{k.thR}</div>
            <Sparkline hist={k.hist}/>
          </div>;
        })}
      </div>
    </div>}
    {/* KRI Config */}
    <div className="card" style={{marginBottom:16}}>
      <div className="stitle">⚙️ Configuración de KRIs</div>
      <div style={{display:'flex',gap:10,marginBottom:14}}>
        <button className="btn-s" style={{fontSize:12,padding:'5px 12px'}} onClick={()=>setShowAll(!showAll)}>
          {showAll?'Mostrar solo activos':'Mostrar todos los KRIs'}
        </button>
        <span style={{fontSize:12,color:'#6b7280',alignSelf:'center'}}>{activeKris.length} de {state.kris.length} KRIs activos</span>
      </div>
      {state.kris.filter(k=>showAll||k.active).map((k,i)=>{
        const idx=state.kris.findIndex(x=>x.id===k.id);
        const st=getKriStatus(k);
        const colors={green:'#22c55e',yellow:'#f59e0b',red:'#ef4444',grey:'#d1d5db'};
        return <div key={k.id} style={{borderBottom:'1px solid #e5e7eb',paddingBottom:14,marginBottom:14}}>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:k.active?10:0}}>
            <input type="checkbox" checked={k.active} onChange={e=>dispatch({type:'SET_KRI',idx,v:{active:e.target.checked}})} style={{width:16,height:16,cursor:'pointer'}}/>
            <div style={{display:'flex',alignItems:'center',gap:6,flex:1}}>
              <span style={{fontWeight:700,color:'#1e3a5f',fontSize:12,width:56}}>{k.id}</span>
              <span style={{fontSize:11,color:'#374151'}}>{k.name}</span>
              <span style={{fontSize:10,color:'#9ca3af'}}>({k.dom})</span>
              {k.active&&<div style={{marginLeft:'auto',width:10,height:10,borderRadius:'50%',background:colors[st]}}/>}
            </div>
          </div>
          {k.active&&<div style={{display:'grid',gridTemplateColumns:'80px 80px 80px 80px 120px 1fr 1fr',gap:8,paddingLeft:26}}>
            <div><label style={{fontSize:10,fontWeight:600,display:'block',marginBottom:3}}>Valor actual</label>
              <input className="fi" style={{fontSize:11}} type="number" value={k.currentVal} onChange={e=>dispatch({type:'SET_KRI',idx,v:{currentVal:e.target.value}})}/></div>
            <div><label style={{fontSize:10,fontWeight:600,display:'block',marginBottom:3,color:'#16a34a'}}>Umbral 🟢</label>
              <input className="fi" style={{fontSize:11}} type="number" value={k.thG} onChange={e=>dispatch({type:'SET_KRI',idx,v:{thG:e.target.value}})}/></div>
            <div><label style={{fontSize:10,fontWeight:600,display:'block',marginBottom:3,color:'#ca8a04'}}>Umbral 🟡</label>
              <input className="fi" style={{fontSize:11}} type="number" value={k.thY} onChange={e=>dispatch({type:'SET_KRI',idx,v:{thY:e.target.value}})}/></div>
            <div><label style={{fontSize:10,fontWeight:600,display:'block',marginBottom:3,color:'#dc2626'}}>Umbral 🔴</label>
              <input className="fi" style={{fontSize:11}} type="number" value={k.thR} onChange={e=>dispatch({type:'SET_KRI',idx,v:{thR:e.target.value}})}/></div>
            <div><label style={{fontSize:10,fontWeight:600,display:'block',marginBottom:3}}>Frecuencia</label>
              <select className="fi" style={{fontSize:11}} value={k.freq} onChange={e=>dispatch({type:'SET_KRI',idx,v:{freq:e.target.value}})}>
                {['Diaria','Semanal','Mensual','Trimestral'].map(f=><option key={f}>{f}</option>)}
              </select></div>
            <div><label style={{fontSize:10,fontWeight:600,display:'block',marginBottom:3}}>Responsable</label>
              <input className="fi" style={{fontSize:11}} value={k.resp} onChange={e=>dispatch({type:'SET_KRI',idx,v:{resp:e.target.value}})} placeholder="Área / persona"/></div>
            <div><label style={{fontSize:10,fontWeight:600,display:'block',marginBottom:3}}>Fuente de datos</label>
              <input className="fi" style={{fontSize:11}} value={k.src} onChange={e=>dispatch({type:'SET_KRI',idx,v:{src:e.target.value}})} placeholder="Sistema / reporte"/></div>
          </div>}
        </div>;
      })}
    </div>
    <div style={{display:'flex',justifyContent:'flex-end'}}>
      <button className="btn-p" onClick={proceed}>IR A EVALUACIÓN AUDITORÍA →</button>
    </div>
  </div>;
}

/* ═══════ MÓDULO 5 — AUDITORÍA ═══════ */
function Module5(){
  const {state,dispatch}=useContext(AppCtx);
  const [pinInput,setPinInput]=useState('');
  const [pinError,setPinError]=useState(false);
  const [newFinding,setNewFinding]=useState({desc:'',cause:'Proceso',riskRef:'',crit:'Alta',rec:'',area:'',due:'',status:'Abierto'});
  const [showFindingForm,setShowFindingForm]=useState(false);
  const applied=state.risks.filter(r=>r.applies&&computeInherent(r.p,r.iF,r.iR,r.iL)>0);
  const allActions=applied.flatMap(r=>r.actions.map(a=>({...a,rCode:r.code,rName:r.name})));
  function unlock(){
    if(pinInput===AUDIT_PIN||pinInput===''){
      dispatch({type:'SET_AUDIT',v:{unlocked:true}});setPinError(false);
    } else {setPinError(true);}
  }
  function ctrlEval(key,field,val){
    const cur=state.audit.controlEvals[key]||{design:'',effectiveness:'',evidence:'',sample:'',obs:''};
    dispatch({type:'SET_CTRL_EVAL',key,v:{...cur,[field]:val}});
  }
  function getCtrlRating(e){
    const d=e?.design,ef=e?.effectiveness;
    if(!d||!ef||ef==='No probado')return null;
    if(d==='Adecuado'&&ef==='Efectivo')return {label:'SATISFACTORIO',color:'#16a34a',bg:'#dcfce7',icon:'🟢'};
    if(d==='Inadecuado'||ef==='Inefectivo')return {label:'DEFICIENTE',color:'#dc2626',bg:'#fee2e2',icon:'🔴'};
    return {label:'NECESITA MEJORA',color:'#d97706',bg:'#fef9c3',icon:'🟡'};
  }
  function addFinding(){
    if(!newFinding.desc||!newFinding.rec){dispatch({type:'TOAST',title:'Error',msg:'Descripción y recomendación requeridas.',type:'error'});return;}
    const code='AUD-'+(state.audit.findings.length+1).toString().padStart(3,'0');
    dispatch({type:'ADD_FINDING',v:{...newFinding,code}});
    setNewFinding({desc:'',cause:'Proceso',riskRef:'',crit:'Alta',rec:'',area:'',due:'',status:'Abierto'});
    setShowFindingForm(false);
    dispatch({type:'TOAST',title:'Hallazgo registrado',msg:code+' añadido.'});
  }
  function findingDue(due){
    if(!due)return 'grey';
    const d=new Date(due),now=new Date();
    const diff=(d-now)/(1000*60*60*24);
    if(diff<0)return 'red';if(diff<=15)return 'yellow';return 'green';
  }
  const dueColors={green:'#22c55e',yellow:'#f59e0b',red:'#ef4444',grey:'#9ca3af'};
  const opinionOpts=[
    {v:'SATISFACTORIO',icon:'🟢',color:'#16a34a',bg:'#f0fdf4'},
    {v:'CON OBSERVACIONES',icon:'🟡',color:'#d97706',bg:'#fefce8'},
    {v:'NECESITA MEJORA SIGNIFICATIVA',icon:'🟠',color:'#ea580c',bg:'#fff7ed'},
    {v:'INSATISFACTORIO',icon:'🔴',color:'#dc2626',bg:'#fef2f2'},
  ];
  if(!state.audit.unlocked){
    return <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:400}}>
      <div className="card" style={{maxWidth:420,textAlign:'center'}}>
        <div style={{fontSize:40,marginBottom:16}}>🔐</div>
        <div style={{fontSize:18,fontWeight:700,color:'#1e3a5f',marginBottom:8}}>Módulo de Auditoría Interna</div>
        <div style={{fontSize:13,color:'#6b7280',marginBottom:24}}>Acceso restringido. Ingrese el PIN de validación para continuar. (Demo: use <strong>1234</strong> o deje en blanco)</div>
        <input className="fi" type="password" maxLength={8} placeholder="PIN de auditoría" value={pinInput}
          onChange={e=>setPinInput(e.target.value)} onKeyDown={e=>e.key==='Enter'&&unlock()}
          style={{textAlign:'center',fontSize:24,letterSpacing:8,marginBottom:8}}/>
        {pinError&&<div style={{color:'#dc2626',fontSize:12,marginBottom:8}}>⚠ PIN incorrecto. Intente nuevamente.</div>}
        <button className="btn-p" style={{width:'100%',marginTop:8}} onClick={unlock}>🔓 ACCEDER A AUDITORÍA</button>
        <div style={{fontSize:11,color:'#9ca3af',marginTop:12}}>PIN de demostración: 1234 | Configurable en producción</div>
      </div>
    </div>;
  }
  return <div>
    <div style={{background:'linear-gradient(135deg,#4c1d95,#6d28d9)',color:'white',borderRadius:12,padding:'20px 24px',marginBottom:20}}>
      <div style={{fontSize:18,fontWeight:800}}>🔎 Módulo 5 — Evaluación de Controles | Auditoría Interna</div>
      <div style={{fontSize:12,opacity:.8,marginTop:4}}>Evalúe el diseño y efectividad operativa de cada control implementado. Emita hallazgos y opinión global de auditoría.</div>
    </div>
    {/* Control evaluations */}
    <div className="card" style={{marginBottom:16}}>
      <div className="stitle">⚖️ Evaluación de Controles Registrados</div>
      {allActions.length===0&&<div style={{color:'#9ca3af',fontSize:13,padding:'16px 0'}}>No hay controles/acciones registradas en el Módulo 3. Complete el plan de acción primero.</div>}
      {allActions.map((a,ai)=>{
        const key=`${a.rCode}-${ai}`;
        const e=state.audit.controlEvals[key]||{};
        const rating=getCtrlRating(e);
        return <div key={key} style={{borderBottom:'1px solid #e5e7eb',paddingBottom:14,marginBottom:14}}>
          <div style={{display:'flex',gap:8,alignItems:'flex-start',marginBottom:10,flexWrap:'wrap'}}>
            <Badge bg="#dbeafe" color="#1e40af">{a.rCode}</Badge>
            <div style={{flex:1}}>
              <div style={{fontSize:12,fontWeight:700}}>{a.desc||'(Sin descripción)'}</div>
              <div style={{fontSize:11,color:'#6b7280'}}>Responsable: {a.resp||'—'} | Estado actual: {a.status}</div>
            </div>
            {rating&&<span style={{background:rating.bg,color:rating.color,padding:'4px 10px',borderRadius:6,fontSize:11,fontWeight:700}}>{rating.icon} {rating.label}</span>}
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:10}}>
            <div>
              <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Diseño del Control</label>
              <select className="fi" style={{fontSize:11}} value={e.design||''} onChange={ev=>ctrlEval(key,'design',ev.target.value)}>
                <option value="">Seleccionar...</option>
                <option>Adecuado</option><option>Parcialmente adecuado</option><option>Inadecuado</option>
              </select>
              <textarea className="fi" style={{fontSize:10,marginTop:4,minHeight:40}} placeholder="Observaciones sobre el diseño..." value={e.obs||''} onChange={ev=>ctrlEval(key,'obs',ev.target.value)}/>
            </div>
            <div>
              <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Efectividad Operativa</label>
              <select className="fi" style={{fontSize:11}} value={e.effectiveness||''} onChange={ev=>ctrlEval(key,'effectiveness',ev.target.value)}>
                <option value="">Seleccionar...</option>
                <option>Efectivo</option><option>Efectivo con excepciones</option><option>Inefectivo</option><option>No probado</option>
              </select>
              <textarea className="fi" style={{fontSize:10,marginTop:4,minHeight:40}} placeholder="Evidencia revisada..." value={e.evidence||''} onChange={ev=>ctrlEval(key,'evidence',ev.target.value)}/>
            </div>
            <div>
              <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Muestra evaluada</label>
              <input className="fi" style={{fontSize:11}} placeholder="Ej. 50 registros revisados" value={e.sample||''} onChange={ev=>ctrlEval(key,'sample',ev.target.value)}/>
            </div>
          </div>
        </div>;
      })}
    </div>
    {/* Findings */}
    <div className="card" style={{marginBottom:16}}>
      <div className="stitle">🚩 Hallazgos de Auditoría</div>
      <div style={{display:'flex',justifyContent:'flex-end',marginBottom:12}}>

          {showFindingForm?'Cancelar':'+ Nuevo Hallazgo'}
        </button>
      </div>
      {showFindingForm&&<div style={{background:'#f8fafc',borderRadius:8,padding:'16px',marginBottom:16,border:'1px solid #e5e7eb'}}>
        <div style={{fontSize:13,fontWeight:700,color:'#1e3a5f',marginBottom:12}}>Registrar Nuevo Hallazgo</div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          <div style={{gridColumn:'1/-1'}}>
            <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Descripción del hallazgo *</label>
            <textarea className="fi" rows={2} value={newFinding.desc} onChange={e=>setNewFinding(f=>({...f,desc:e.target.value}))} placeholder="Describa el hallazgo de manera clara y objetiva..."/>
          </div>
          {[{l:'Causa raíz',f:'cause',type:'select',opts:['Personas','Proceso','Tecnología','Gobierno']},
            {l:'Riesgo asociado',f:'riskRef',type:'select',opts:[''].concat(applied.map(r=>r.code))},
            {l:'Criticidad',f:'crit',type:'select',opts:['Alta','Media','Baja']},
            {l:'Área responsable',f:'area',type:'text',placeholder:'Área que debe subsanar'},
            {l:'Fecha límite',f:'due',type:'date'},
            {l:'Estado',f:'status',type:'select',opts:['Abierto','En proceso','Cerrado','Vencido']},

              {type==='select'?<select className="fi" style={{fontSize:11}} value={newFinding[f]} onChange={e=>setNewFinding(n=>({...n,[f]:e.target.value}))}>
                {opts.map(o=><option key={o}>{o}</option>)}
              </select>:type==='date'?<input className="fi" type="date" style={{fontSize:11}} value={newFinding[f]} onChange={e=>setNewFinding(n=>({...n,[f]:e.target.value}))}/>
              :<input className="fi" style={{fontSize:11}} placeholder={placeholder} value={newFinding[f]} onChange={e=>setNewFinding(n=>({...n,[f]:e.target.value}))}/>}
            </div>
          ))}
          <div style={{gridColumn:'1/-1'}}>
            <label style={{fontSize:11,fontWeight:600,display:'block',marginBottom:3}}>Recomendación *</label>
            <textarea className="fi" rows={2} value={newFinding.rec} onChange={e=>setNewFinding(f=>({...f,rec:e.target.value}))} placeholder="Describa la acción recomendada para subsanar el hallazgo..."/>

        <div style={{display:'flex',justifyContent:'flex-end',marginTop:12}}>
          <button className="btn-p" onClick={addFinding}>Registrar Hallazgo</button>
        </div>
      </div>}
      {state.audit.findings.length===0&&!showFindingForm&&<div style={{color:'#9ca3af',fontSize:13,padding:'16px 0'}}>Sin hallazgos registrados.</div>}
      {state.audit.findings.length>0&&<div style={{overflowX:'auto'}}>
        <table>
          <thead><tr><th>Código</th><th>Descripción</th><th>Causa</th><th>Riesgo</th><th>Criticidad</th><th>Área</th><th>Fecha límite</th><th>Estado</th></tr></thead>
          <tbody>{state.audit.findings.map((f,fi)=>{

              <td><Badge bg="#e0e7ff" color="#3730a3">{f.cause}</Badge></td>
              <td style={{fontWeight:700,color:'#1e3a5f'}}>{f.riskRef}</td>

      <div className="stitle">📜 Opinión de Auditoría</div>
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:10,marginBottom:16}}>
        {opinionOpts.map(o=><button key={o.v} onClick={()=>dispatch({type:'SET_AUDIT',v:{opinion:o.v}})}
          style={{padding:'12px 16px',borderRadius:8,border:`2px solid ${state.audit.opinion===o.v?o.color:'#e5e7eb'}`,background:state.audit.opinion===o.v?o.bg:'white',cursor:'pointer',textAlign:'left'}}>
          <div style={{fontSize:16,marginBottom:4}}>{o.icon}</div>

      </div>
      <div style={{marginBottom:12}}>
        <label style={{fontSize:12,fontWeight:600,display:'block',marginBottom:4}}>Párrafo de opinión narrativa</label>
        <textarea className="fi" rows={4} value={state.audit.narrative||''} onChange={e=>dispatch({type:'SET_AUDIT',v:{narrative:e.target.value}})}
          placeholder="Redacte aquí la opinión de auditoría con el detalle de hallazgos y conclusiones..."/>

/* ═══════ MODULE 6 — PORTFOLIO IA / VISTA GOBIERNO ═══════ */
function Module6(){
  const [view,setView]=useState('tabla');
  const [sort,setSort]=useState({col:'id',dir:1});
  const [sel,setSel]=useState(null);
  const [filters,setFilters]=useState({type:'',phase:'',crit:'',area:'',status:'',gov:''});

  const P=PORTFOLIO_INITIATIVES;

  // Filter
  const filtered=P.filter(d=>{
    if(filters.type&&d.type!==filters.type)return false;
    if(filters.phase&&d.phase!==filters.phase)return false;
    if(filters.crit&&d.criticality!==filters.crit)return false;
    if(filters.area&&d.userArea!==filters.area)return false;
    if(filters.status&&d.status!==filters.status)return false;
    if(filters.gov&&d.govOpinion!==filters.gov)return false;
    return true;
  });

  // Sort
  const sorted=[...filtered].sort((a,b)=>{
    const va=a[sort.col],vb=b[sort.col];
    if(typeof va==='number')return sort.dir*(va-vb);
    return sort.dir*String(va).localeCompare(String(vb),'es');
  });

  function toggleSort(col){setSort(s=>({col,dir:s.col===col?-s.dir:1}));}

  // KPIs (always from full set)
  const total=P.length;
  const favorable=P.filter(d=>d.govOpinion==='FAVORABLE').length;
  const condicionado=P.filter(d=>d.govOpinion==='CONDICIONADO').length;
  const desfavorable=P.filter(d=>d.govOpinion==='DESFAVORABLE').length;
  const criticos=P.filter(d=>d.criticality==='Crítico').length;
  const atRisk=P.filter(d=>d.status==='Con Retraso'||d.status==='Suspendido'||d.status==='Detenido').length;
  const totalFindings=P.reduce((s,d)=>s+d.openFindings,0);
  const totalOOA=P.reduce((s,d)=>s+d.outAppetite,0);
  const avgProgress=Math.round(P.reduce((s,d)=>s+(d.progress||0),0)/total);

  // Unique option lists
  const uTypes=[...new Set(P.map(d=>d.type))].sort();
  const uPhases=[...new Set(P.map(d=>d.phase))].sort();
  const uCrits=['Crítico','Alto','Medio','Bajo'];
  const uAreas=[...new Set(P.map(d=>d.userArea))].sort();
  const uStatus=[...new Set(P.map(d=>d.status))].sort();
  const uGov=['FAVORABLE','CONDICIONADO','DESFAVORABLE','PENDIENTE'];

  // Colors helpers
  function govStyle(op){
    if(op==='FAVORABLE')return{bg:'#dcfce7',color:'#15803d',border:'#86efac'};
    if(op==='CONDICIONADO')return{bg:'#fef3c7',color:'#92400e',border:'#fcd34d'};
    if(op==='DESFAVORABLE')return{bg:'#fee2e2',color:'#dc2626',border:'#fca5a5'};
    return{bg:'#f3f4f6',color:'#6b7280',border:'#d1d5db'};
  }
  function critStyle(c){
    if(c==='Crítico')return{bg:'#fee2e2',color:'#dc2626'};
    if(c==='Alto')return{bg:'#fff7ed',color:'#c2410c'};
    if(c==='Medio')return{bg:'#fefce8',color:'#a16207'};
    return{bg:'#f0fdf4',color:'#15803d'};
  }
  function statusIcon(s){
    if(s==='Completado')return{icon:'✅',color:'#15803d'};
    if(s==='En Tiempo')return{icon:'🟢',color:'#15803d'};
    if(s==='Con Retraso')return{icon:'🔴',color:'#dc2626'};
    if(s==='Suspendido')return{icon:'⛔',color:'#7c3aed'};
    if(s==='Detenido')return{icon:'🟠',color:'#c2410c'};
    return{icon:'⚪',color:'#6b7280'};
  }
  function phaseColor(ph){
    if(ph==='Producción')return'#0369a1';
    if(ph==='Piloto')return'#7c3aed';
    if(ph==='Desarrollo')return'#0891b2';
    if(ph==='Suspendido')return'#6b7280';
    return'#374151';
  }

  // Matrix data: Criticality × Phase
  const matrixCrits=['Crítico','Alto','Medio','Bajo'];
  const matrixPhases=['Producción','Piloto','Desarrollo','Suspendido'];
  function matrixCell(c,ph){return P.filter(d=>d.criticality===c&&d.phase===ph);}

  // Simple inline bar chart helper (pure CSS, no lib)
  function MiniBar({label,count,max,color}){

  // KPI Card component

  // Executive summary text

  function execSummary(){
    const lines=[];
    lines.push(`El Portfolio de Iniciativas IA comprende ${total} proyectos activos con un avance promedio del ${avgProgress}% al ${new Date().toLocaleDateString('es-PY',{day:'2-digit',month:'long',year:'numeric'})}.`);

      {sorted.length===0&&<div style={{textAlign:'center',padding:32,color:'#9ca3af',fontSize:13,gridColumn:'1/-1'}}>No hay iniciativas que coincidan con los filtros aplicados.</div>}
    </div>;
  }

  // ─── MATRIX + CHARTS VIEW ───
  function MatrixView(){
    const byType=uTypes.map(t=>({label:t,count:P.filter(d=>d.type===t).length}));
    const byPhaseData=matrixPhases.map(ph=>({label:ph,count:P.filter(d=>d.phase===ph).length}));
    const byGov=[
      {label:'FAVORABLE',count:favorable,color:'#22c55e'},
      {label:'CONDICIONADO',count:condicionado,color:'#f59e0b'},
      {label:'DESFAVORABLE',count:desfavorable,color:'#ef4444'},
      {label:'PENDIENTE',count:P.filter(d=>d.govOpinion==='PENDIENTE').length,color:'#9ca3af'},
    ].filter(x=>x.count>0);
    const byCrit=uCrits.map(c=>({label:c,count:P.filter(d=>d.criticality===c).length,...critStyle(c)}));
    const byArea=[...new Set(P.map(d=>d.userArea))].map(a=>({label:a,count:P.filter(d=>d.userArea===a).length})).sort((a,b)=>b.count-a.count);
    const maxCount=Math.max(...[...byType,...byPhaseData,...byArea].map(x=>x.count));

    return <div>
      {/* Criticality × Phase Matrix */}
      <div className="card" style={{marginBottom:16}}>
        <div className="stitle">🗺️ Matriz de Portfolio: Criticidad × Fase de Implementación</div>
        <div style={{overflowX:'auto'}}>
          <table style={{fontSize:12}}>
            <thead>
              <tr>
                <th style={{background:'#1e3a5f',color:'white',width:90}}>Criticidad \ Fase</th>
                {matrixPhases.map(ph=><th key={ph} style={{background:'#1e3a5f',color:'white',textAlign:'center',minWidth:110}}>
                  <span style={{color:phaseColor(ph)!=='#374151'?phaseColor(ph):'#93c5fd'}}>●</span> {ph}
                </th>)}
                <th style={{background:'#1e3a5f',color:'white',textAlign:'center'}}>Total</th>
              </tr>
            </thead>
            <tbody>
              {matrixCrits.map(c=>{
                const cs=critStyle(c);
                const rowTotal=P.filter(d=>d.criticality===c).length;
                return <tr key={c}>
                  <td style={{background:cs.bg,color:cs.color,fontWeight:700,textAlign:'center',padding:'10px 8px'}}>{c}</td>
                  {matrixPhases.map(ph=>{
                    const items=matrixCell(c,ph);
                    return <td key={ph} style={{background:items.length>0?cs.bg:'#fafafa',textAlign:'center',verticalAlign:'top',padding:'8px'}}>
                      {items.length>0?<div>
                        <div style={{fontSize:18,fontWeight:800,color:cs.color}}>{items.length}</div>
                        {items.map(d=>{
                          const gs=govStyle(d.govOpinion);
                          return <div key={d.id} onClick={()=>setSel(d)} style={{fontSize:9,cursor:'pointer',marginTop:3,background:'white',border:`1px solid ${gs.border}`,borderRadius:4,padding:'2px 5px',color:gs.color,fontWeight:700,display:'inline-block',maxWidth:95,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}
                            title={d.name}>{d.id} · {d.govOpinion.slice(0,4)}</div>;
                        })}
                      </div>:<div style={{color:'#d1d5db',fontSize:12}}>—</div>}
                    </td>;
                  })}
                  <td style={{textAlign:'center',fontWeight:800,color:cs.color,background:cs.bg}}>{rowTotal}</td>
                </tr>;
              })}
              <tr style={{background:'#f0f4f8'}}>
                <td style={{fontWeight:700}}>Total</td>
                {matrixPhases.map(ph=><td key={ph} style={{textAlign:'center',fontWeight:700}}>{P.filter(d=>d.phase===ph).length}</td>)}
                <td style={{textAlign:'center',fontWeight:800,color:'#1e3a5f'}}>{total}</td>
              </tr>
            </tbody>
          </table>
        </div>
        <div style={{display:'flex',gap:8,marginTop:10,flexWrap:'wrap'}}>
          {['FAVORABLE','CONDICIONADO','DESFAVORABLE','PENDIENTE'].map(op=>{
            const gs=govStyle(op);
            return <span key={op} style={{background:gs.bg,color:gs.color,border:`1px solid ${gs.border}`,padding:'2px 10px',borderRadius:4,fontSize:10,fontWeight:700}}>{op}</span>;
          })}
          <span style={{fontSize:10,color:'#9ca3af',marginLeft:4,alignSelf:'center'}}>← Leyenda: Color badge = Opinión del Comité</span>
        </div>
      </div>

      {/* Charts grid */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:16,marginBottom:16}}>
        {/* By Gov Opinion */}
        <div className="card">
          <div className="stitle">📊 Distribución por Opinión del Comité</div>
          {byGov.map(x=><MiniBar key={x.label} label={x.label} count={x.count} max={total} color={x.color}/>)}
          <div style={{marginTop:12,display:'flex',gap:6,flexWrap:'wrap'}}>
            {byGov.map(x=><div key={x.label} style={{textAlign:'center',flex:1,minWidth:60}}>
              <div style={{fontSize:22,fontWeight:800,color:x.color}}>{Math.round(x.count/total*100)}%</div>
              <div style={{fontSize:9,color:'#6b7280'}}>{x.label}</div>
            </div>)}
          </div>
        </div>
        {/* By Type */}
        <div className="card">
          <div className="stitle">🤖 Iniciativas por Tipo de IA</div>
          {byType.map(x=><MiniBar key={x.label} label={x.label} count={x.count} max={maxCount} color='#3b82f6'/>)}
        </div>
        {/* By Phase */}
        <div className="card">
          <div className="stitle">🔄 Iniciativas por Fase de Implementación</div>
          {byPhaseData.map(x=><MiniBar key={x.label} label={x.label} count={x.count} max={maxCount} color={phaseColor(x.label)}/>)}
        </div>
        {/* By Area */}
        <div className="card">
          <div className="stitle">🏢 Iniciativas por Área Usuaria</div>
          {byArea.map(x=><MiniBar key={x.label} label={x.label} count={x.count} max={maxCount} color='#8b5cf6'/>)}
        </div>
      </div>

      {/* Risk score table */}
      <div className="card" style={{marginBottom:16}}>
        <div className="stitle">⚠️ Perfil de Riesgo Consolidado — Todas las Iniciativas</div>
        <table>
          <thead><tr>
            <th>Iniciativa</th><th>Tipo</th><th>Criticidad</th><th>Score Inherente</th><th>Score Residual</th><th>Riesgos</th><th>Fuera Apetito</th><th>Hallazgos</th><th>Opinión</th>
          </tr></thead>
          <tbody>
            {[...P].sort((a,b)=>b.residualAvg-a.residualAvg).map(d=>{
              const gs=govStyle(d.govOpinion);
              const cs=critStyle(d.criticality);
              return <tr key={d.id} onClick={()=>setSel(d)} style={{cursor:'pointer'}}>
                <td style={{fontWeight:600,fontSize:12}}><span style={{color:'#9ca3af',fontSize:10}}>{d.id}</span><br/>{d.name}</td>
                <td style={{fontSize:11}}>{d.type}</td>
                <td><span className="badge" style={{background:cs.bg,color:cs.color,fontSize:11}}>{d.criticality}</span></td>
                <td style={{textAlign:'center',fontWeight:700,color:'#dc2626'}}>{d.inherentAvg}</td>
                <td style={{textAlign:'center',fontWeight:800,color:d.residualAvg>6?'#dc2626':d.residualAvg>3?'#f59e0b':'#16a34a',fontSize:14}}>{d.residualAvg}</td>
                <td style={{textAlign:'center'}}>{d.riskCount}</td>
                <td style={{textAlign:'center',fontWeight:700,color:d.outAppetite>0?'#dc2626':'#16a34a'}}>{d.outAppetite}</td>
                <td style={{textAlign:'center',fontWeight:700,color:d.openFindings>0?'#7c3aed':'#16a34a'}}>{d.openFindings}</td>
                <td><span style={{background:gs.bg,color:gs.color,border:`1px solid ${gs.border}`,padding:'2px 8px',borderRadius:4,fontSize:10,fontWeight:700}}>{d.govOpinion}</span></td>
              </tr>;
            })}
          </tbody>
        </table>
      </div>
    </div>;
  }

  // ─── RENDER ───
  return <div>
    {sel&&<DetailModal d={sel} onClose={()=>setSel(null)}/>}

    {/* Header */}
    <div style={{background:'linear-gradient(135deg,#1a3256 0%,#2a5298 60%,#1e3a5f 100%)',color:'white',borderRadius:12,padding:'20px 24px',marginBottom:16}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',flexWrap:'wrap',gap:12}}>
        <div>
          <div style={{fontSize:11,opacity:.6,letterSpacing:1,textTransform:'uppercase',marginBottom:4}}>Comité de Gobierno IA</div>
          <div style={{fontSize:20,fontWeight:800}}>🏛️ Portfolio de Iniciativas IA — Vista Ejecutiva</div>
          <div style={{fontSize:12,opacity:.7,marginTop:4}}>Consolidado de todas las iniciativas · Evaluación al {new Date().toLocaleDateString('es-PY',{day:'2-digit',month:'long',year:'numeric'})}</div>
        </div>
        <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
          {['tabla','tarjetas','matriz'].map(v=><button key={v} onClick={()=>setView(v)} style={{padding:'7px 14px',borderRadius:6,fontSize:12,fontWeight:600,cursor:'pointer',border:'none',background:view===v?'rgba(255,255,255,.95)':' rgba(255,255,255,.15)',color:view===v?'#1e3a5f':'white',transition:'all .15s',textTransform:'capitalize'}}>
            {v==='tabla'?'📋 Tabla':v==='tarjetas'?'🃏 Tarjetas':'📊 Matrices'}
          </button>)}
        </div>
      </div>
    </div>

    {/* KPI Cards */}
    <div style={{display:'flex',gap:10,flexWrap:'wrap',marginBottom:16}}>
      <KpiCard icon='📁' label='Total Iniciativas' value={total} sub={`Promedio avance: ${avgProgress}%`} color='#1e3a5f' bg='white'/>
      <KpiCard icon='✅' label='FAVORABLE' value={favorable} sub={`${Math.round(favorable/total*100)}% del portfolio`} color='#15803d' bg='white'/>
      <KpiCard icon='🟡' label='CONDICIONADO' value={condicionado} sub='Con compromisos' color='#92400e' bg='white'/>
      <KpiCard icon='🔴' label='DESFAVORABLE' value={desfavorable} sub='Requieren acción' color='#dc2626' bg='#fef2f2'/>
      <KpiCard icon='⚡' label='Criticidad Crítico' value={criticos} sub='Máxima prioridad' color='#dc2626' bg='white'/>
      <KpiCard icon='⚠️' label='Con Desviación' value={atRisk} sub='Retraso o suspendido' color='#c2410c' bg='white'/>
      <KpiCard icon='📋' label='Hallazgos Abiertos' value={totalFindings} sub='Total portfolio' color='#7c3aed' bg='white'/>
      <KpiCard icon='🚨' label='Fuera de Apetito' value={totalOOA} sub='Riesgos consolidados' color='#dc2626' bg={totalOOA>0?'#fef2f2':'white'}/>
    </div>

    {/* Filter bar */}
    <div className="card" style={{marginBottom:16,padding:'12px 16px'}}>
      <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'flex-end'}}>
        <div style={{flex:1,minWidth:100}}>
          <div style={{fontSize:10,fontWeight:600,color:'#6b7280',marginBottom:3}}>TIPO DE IA</div>
          <select className="fi" value={filters.type} onChange={e=>setFilters(f=>({...f,type:e.target.value}))}>
            <option value="">Todos</option>{uTypes.map(t=><option key={t}>{t}</option>)}</select>
        </div>
        <div style={{flex:1,minWidth:100}}>
          <div style={{fontSize:10,fontWeight:600,color:'#6b7280',marginBottom:3}}>FASE</div>
          <select className="fi" value={filters.phase} onChange={e=>setFilters(f=>({...f,phase:e.target.value}))}>
            <option value="">Todas</option>{uPhases.map(p=><option key={p}>{p}</option>)}</select>
        </div>
        <div style={{flex:1,minWidth:100}}>
          <div style={{fontSize:10,fontWeight:600,color:'#6b7280',marginBottom:3}}>CRITICIDAD</div>
          <select className="fi" value={filters.crit} onChange={e=>setFilters(f=>({...f,crit:e.target.value}))}>
            <option value="">Todas</option>{uCrits.map(c=><option key={c}>{c}</option>)}</select>
        </div>
        <div style={{flex:1,minWidth:100}}>
          <div style={{fontSize:10,fontWeight:600,color:'#6b7280',marginBottom:3}}>ÁREA USUARIA</div>
          <select className="fi" value={filters.area} onChange={e=>setFilters(f=>({...f,area:e.target.value}))}>
            <option value="">Todas</option>{uAreas.map(a=><option key={a}>{a}</option>)}</select>
        </div>
        <div style={{flex:1,minWidth:100}}>
          <div style={{fontSize:10,fontWeight:600,color:'#6b7280',marginBottom:3}}>ESTADO</div>
          <select className="fi" value={filters.status} onChange={e=>setFilters(f=>({...f,status:e.target.value}))}>
            <option value="">Todos</option>{uStatus.map(s=><option key={s}>{s}</option>)}</select>
        </div>
        <div style={{flex:1,minWidth:100}}>
          <div style={{fontSize:10,fontWeight:600,color:'#6b7280',marginBottom:3}}>OPINIÓN GOV.</div>
          <select className="fi" value={filters.gov} onChange={e=>setFilters(f=>({...f,gov:e.target.value}))}>
            <option value="">Todas</option>{uGov.map(g=><option key={g}>{g}</option>)}</select>
        </div>
        <button onClick={()=>setFilters({type:'',phase:'',crit:'',area:'',status:'',gov:''})} className="btn-s" style={{fontSize:11,padding:'6px 12px',height:32,flexShrink:0}}>✕ Limpiar</button>
        {Object.values(filters).some(v=>v)&&<div style={{fontSize:11,color:'#6b7280',alignSelf:'center',flexShrink:0}}>{filtered.length} de {total}</div>}
      </div>
    </div>

    {/* Active view */}
    {view==='tabla'&&<div className="card" style={{padding:0,overflow:'hidden'}}><div style={{padding:'14px 16px 12px',borderBottom:'1px solid #e5e7eb',background:'#f8fafc',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <span style={{fontSize:13,fontWeight:700,color:'#1e3a5f'}}>📋 Tabla de Iniciativas ({sorted.length})</span>
      <span style={{fontSize:11,color:'#9ca3af'}}>Clic en columna para ordenar · Clic en fila para ver detalle</span>
    </div><div style={{padding:0}}><TableView/></div></div>}
    {view==='tarjetas'&&<div><div style={{fontSize:13,fontWeight:700,color:'#6b7280',marginBottom:10}}>🃏 {sorted.length} iniciativa(s) · Clic para ver detalle</div><CardsView/></div>}
    {view==='matriz'&&<MatrixView/>}

    {/* Executive Summary */}
    <div className="card" style={{marginTop:16,borderLeft:'4px solid #1e3a5f',background:'#f8fafc'}}>
      <div className="stitle" style={{borderColor:'#dbeafe'}}>📝 Resumen Ejecutivo — Comité de Gobierno IA</div>
      <div style={{fontSize:12,color:'#374151',lineHeight:1.8}}>
        {execSummary().map((line,i)=><div key={i} style={{marginBottom:i<execSummary().length-1?6:0,paddingLeft:line.startsWith('⚠️')||line.startsWith('🔴')||line.startsWith('🟡')||line.startsWith('🚨')||line.startsWith('📋')?0:0}}>{line}</div>)}
      </div>
      <div style={{marginTop:12,fontSize:10,color:'#9ca3af',borderTop:'1px solid #e5e7eb',paddingTop:8}}>
        Generado automáticamente por AIRAT v1.0 · {new Date().toLocaleString('es-PY')} · Basado en {total} iniciativas registradas
      </div>
    </div>
  </div>;
}

/* ═══════ APP PRINCIPAL ═══════ */
function App(){
  const [state,dispatch]=useReducer(reducer,initState);
  const [showDemo,setShowDemo]=useState(null);
  const [showReset,setShowReset]=useState(false);
  useEffect(()=>{
    if(!state.demoLoaded){setShowDemo(true);}
  },[]);
  useEffect(()=>{
    try{localStorage.setItem('airat_state',JSON.stringify(state));}catch(e){}
  },[state]);
  useEffect(()=>{
    // Check KRI alerts
    state.kris.forEach(k=>{
      if(!k.active||k.currentVal===''||k.thR==='')return;
      const v=parseFloat(k.currentVal);const r=parseFloat(k.thR);
      const inverted=k.id==='KRI-10'||k.id==='KRI-03'||k.id==='KRI-09'||k.id==='KRI-07'||k.id==='KRI-12'||k.id==='KRI-14';
      const isRed=inverted?v<parseFloat(k.thR):v>r;
      if(isRed&&v!==''){}
    });
  },[state.kris]);
  const ctxVal={state,dispatch};
  function loadDemo(){setShowDemo(false);dispatch({type:'LOAD_DEMO'});dispatch({type:'TOAST',title:'Datos de demo cargados',msg:'Proyecto: Sistema de Scoring Crediticio con IA Generativa'});}
  function skipDemo(){setShowDemo(false);}
  const modules=[
    {comp:<Module0/>,title:'Módulo 0'},
    {comp:<Module1/>,title:'Módulo 1'},
    {comp:<Module2/>,title:'Módulo 2'},
    {comp:<Module3/>,title:'Módulo 3'},
    {comp:<Module4/>,title:'Módulo 4'},
    {comp:<Module5/>,title:'Módulo 5'},
    {comp:<Module6/>,title:'Portfolio IA'},
  ];
  return <AppCtx.Provider value={ctxVal}>
    <div style={{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden'}}>
      {/* Demo modal */}
      {showDemo&&<div className="modal-overlay" style={{zIndex:200}}>
        <div className="modal-box" style={{textAlign:'center',maxWidth:480}}>
          <div style={{fontSize:40,marginBottom:12}}>🤖</div>
          <div style={{fontSize:20,fontWeight:800,color:'#1e3a5f',marginBottom:8}}>AIRAT — AI Risk Assessment Tool</div>
          <div style={{fontSize:13,color:'#6b7280',marginBottom:20,lineHeight:1.6}}>
            Herramienta de evaluación de riesgos de Inteligencia Artificial para entidades financieras.<br/>
            <strong>¿Desea cargar datos de ejemplo</strong> para explorar todas las funcionalidades?<br/>
            <span style={{fontSize:11}}>Proyecto demo: Sistema de Scoring Crediticio con IA Generativa</span>
          </div>
          <div style={{background:'#f8fafc',borderRadius:8,padding:'12px 16px',marginBottom:20,fontSize:11,textAlign:'left',color:'#6b7280'}}>
            📌 Marcos: ISO 42001 · NIST AI RMF · EU AI Act · COSO ERM · Basel III · SR 11-7 · SB/BCP Paraguay
          </div>
          <div style={{display:'flex',gap:12,justifyContent:'center'}}>
            <button className="btn-s" onClick={skipDemo}>Iniciar desde cero</button>
            <button className="btn-p" onClick={loadDemo}>✨ Cargar datos de demo</button>
          </div>
        </div>
      </div>}
      {/* Reset confirm */}
      {showReset&&<ConfirmModal msg="¿Está seguro de que desea resetear toda la evaluación? Esta acción no se puede deshacer." onOk={()=>{dispatch({type:'RESET'});setShowReset(false);setShowDemo(true);}} onCancel={()=>setShowReset(false)}/>}
      {/* Header */}
      <Header/>
      {/* Body */}
      <div style={{display:'flex',flex:1,overflow:'hidden'}}>
        {/* Sidebar */}
        <div style={{overflowY:'auto',flexShrink:0}}>
          <Sidebar/>
          <div style={{padding:'10px 16px',borderTop:'1px solid #e5e7eb'}}>
            <button onClick={()=>setShowReset(true)} style={{width:'100%',background:'#fee2e2',color:'#dc2626',border:'1px solid #fca5a5',padding:'6px',borderRadius:6,fontSize:11,fontWeight:600,cursor:'pointer'}}>
              🔄 Resetear evaluación
            </button>
          </div>
        </div>
        {/* Main content */}
        <div style={{flex:1,overflowY:'auto',padding:'20px 24px'}}>
          {/* Progress */}
          {state.activeModule!==6&&<div className="card no-print" style={{marginBottom:16,padding:'12px 20px'}}>
            <ProgressSteps current={state.activeModule} unlocked={state.unlocked}/>
          </div>}
          {/* Active module */}
          {modules[state.activeModule]?.comp}
          {/* Audit opinion banner */}
          {state.activeModule===5&&state.audit.opinion&&state.audit.auditor&&<div style={{marginTop:16,padding:'16px 20px',borderRadius:10,background:state.audit.opinion==='SATISFACTORIO'?'#f0fdf4':state.audit.opinion==='INSATISFACTORIO'?'#fef2f2':'#fefce8',border:`2px solid ${state.audit.opinion==='SATISFACTORIO'?'#22c55e':state.audit.opinion==='INSATISFACTORIO'?'#ef4444':'#f59e0b'}`}}>
            <div style={{fontSize:14,fontWeight:700,marginBottom:4}}>📜 Opinión Final de Auditoría: <strong>{state.audit.opinion}</strong></div>
            {state.audit.narrative&&<div style={{fontSize:12,color:'#374151',marginBottom:8,lineHeight:1.5}}>{state.audit.narrative}</div>}
            <div style={{fontSize:11,color:'#6b7280'}}>Firmado por: <strong>{state.audit.auditor}</strong> — {state.audit.cargo} | {state.audit.date}</div>
          </div>}
          {/* Footer */}
          <div style={{marginTop:24,borderTop:'1px solid #e5e7eb',paddingTop:12,fontSize:10,color:'#9ca3af',display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:4}}>
            <span>AIRAT v1.0 | AI Risk Assessment Tool | © Prime Consultores {new Date().getFullYear()}</span>
            <span>ISO/IEC 42001 · NIST AI RMF 1.0 · EU AI Act · COSO ERM 2017 · ISO 31000 · Basel III · SR 11-7 · SB/BCP Paraguay</span>
          </div>
        </div>
      </div>
    </div>
    <ToastSystem/>
  </AppCtx.Provider>;
}

/* ═══════ RENDER ═══════ */
window.__airatSetBar&&window.__airatSetBar(90);
window.__airatSetStatus&&window.__airatSetStatus('Montando interfaz…');
const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
/* Hide loading overlay once React takes over */
setTimeout(function(){window.__airatHideLoading&&window.__airatHideLoading();},400);
</script>
</body>
</html>
